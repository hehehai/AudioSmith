# CI: Linux runs the full Go suite (views in ui.Tester, services, store,
# jobs, the supervisor against a scripted engine, the hub against a fake HF,
# the protocol fixtures, i18n key parity, mygo.json and CHANGELOG.md for
# releases), -race, MyGo's vet, gofmt, snapshots and actionlint. Windows runs
# native CGO_ENABLED=0 vet, amd64+arm64 builds of AudioSmith.exe and
# audiosmith-engine.exe, MyGo's vet and Go unit tests (using MyGo's
# published Sqlitecore.dll). The Swift engine and macOS end-to-end tests
# need Apple silicon; they are not run here (README: Tests). Releases:
# release.yml.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "research/**", "plan/**"]
  pull_request:
    paths-ignore: ["**.md", "research/**", "plan/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: SQLite library for MyGo's SQLite plugin
        # MyGo (ActNow's fork, go.mod's replace) is a module in the cache,
        # so the plugin's native module loads the library MyGo published
        # (its mygo-plugin.json), downloading it on first use into
        # ~/.cache/mygo/natives/<sha256>/ and checking its sha256. CI keeps
        # that directory between runs.
        id: sqlite
        run: |
          # go list -m gives no directory for a module not downloaded yet;
          # go mod download names the replacement's.
          dir="$(go mod download -json github.com/egoist/mygo | jq -r .Dir)/plugins/sqlite/internal/sqlitecore"
          [ -f "$dir/mygo-plugin.json" ] || { echo "::error::no $dir/mygo-plugin.json"; exit 1; }
          echo "sha=$(jq -r '.libraries[0].files["linux-amd64"].sha256' "$dir/mygo-plugin.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/mygo/natives
          key: mygo-natives-${{ steps.sqlite.outputs.sha }}

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^engine/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd: $unformatted"
            exit 1
          fi

      - name: Workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      # The app (./app) and internal/services take over go test's default
      # 10 minutes under -race on the hosted runner.
      - name: Race
        run: CGO_ENABLED=1 go test -race -timeout 30m ./...

      - name: MyGo vet
        run: go tool mygo vet .

      - name: Snapshots
        run: |
          AUDIOSMITH_SNAPSHOTS="$RUNNER_TEMP/shots" go test -run TestSnapshots ./app
          ls "$RUNNER_TEMP/shots" | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: ${{ runner.temp }}/shots
          retention-days: 7

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: SQLite library for MyGo's SQLite plugin
        # MyGo publishes a prebuilt Sqlitecore.dll for windows-amd64 and
        # windows-arm64 (mygo-plugin.json), downloaded on first use into
        # %LOCALAPPDATA%\mygo\natives\<sha256>\ and verified by sha256,
        # so Zig is not required on CI unless rebuilding sqlitecore from source.
        id: sqlite
        shell: pwsh
        run: |
          $dir = (go mod download -json github.com/egoist/mygo | ConvertFrom-Json).Dir
          $plugin = Join-Path $dir "plugins\sqlite\internal\sqlitecore\mygo-plugin.json"
          if (!(Test-Path $plugin)) {
            Write-Error "no $plugin"
            exit 1
          }
          $sha = (Get-Content $plugin -Raw | ConvertFrom-Json).libraries[0].files.'windows-amd64'.sha256
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/mygo/natives
          key: mygo-natives-windows-amd64-${{ steps.sqlite.outputs.sha }}

      - name: Vet (amd64 & arm64)
        shell: pwsh
        run: |
          go vet ./...
          $env:GOARCH = "arm64"
          go vet ./app ./internal/... ./engine-win/...

      - name: Build AudioSmith.exe & audiosmith-engine.exe (amd64 & arm64)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "win-build"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          go build -o (Join-Path $out "AudioSmith.exe") ./app
          go build -o (Join-Path $out "audiosmith-engine.exe") ./engine-win/cmd/audiosmith-engine
          $env:GOARCH = "arm64"
          go build -o (Join-Path $out "AudioSmith-arm64.exe") ./app
          go build -o (Join-Path $out "audiosmith-engine-arm64.exe") ./engine-win/cmd/audiosmith-engine
          Get-ChildItem $out

      - name: MyGo vet
        shell: pwsh
        run: go tool mygo vet .

      - name: Test
        shell: pwsh
        run: go test -count=1 ./app ./internal/... ./engine-win/...
